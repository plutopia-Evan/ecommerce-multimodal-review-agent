    - data:
        code: "import json\nimport re\n\n\ndef main(raw_text: str) -> dict:\n    default_result\
          \ = {\n        \"image_is_malicious\": False,\n        \"image_quality\"\
          : \"manual_review\",\n        \"image_category\": \"无法判断\",\n        \"\
          image_evidence\": \"\",\n        \"image_reason\": \"图片分析结果解析失败，转人工复核。\"\
          ,\n        \"normal_image_count\": 0,\n        \"invalid_image_count\":\
          \ 0,\n        \"next_route\": \"manual_review\",\n        \"parse_success\"\
          : False,\n        \"parse_error\": \"\"\n    }\n\n    try:\n        text\
          \ = raw_text or \"\"\n\n        # 删除 DeepSeek 的思考内容\n        text = re.sub(\n\
          \            r\"<think>.*?</think>\",\n            \"\",\n            text,\n\
          \            flags=re.DOTALL\n        ).strip()\n\n        # 提取 JSON 对象\n\
          \        start = text.find(\"{\")\n        end = text.rfind(\"}\")\n\n \
          \       if start == -1 or end == -1 or end <= start:\n            raise\
          \ ValueError(\"未找到完整的JSON对象\")\n\n        data = json.loads(text[start:end\
          \ + 1])\n\n        quality_map = {\n            \"normal\": \"image_ok\"\
          ,\n            \"正常\": \"image_ok\",\n            \"image_ok\": \"image_ok\"\
          ,\n            \"invalid\": \"image_low_quality\",\n            \"低质量\"\
          : \"image_low_quality\",\n            \"image_low_quality\": \"image_low_quality\"\
          ,\n            \"malicious\": \"malicious\",\n            \"恶意\": \"malicious\"\
          ,\n            \"manual_review\": \"manual_review\"\n        }\n\n     \
          \   route_map = {\n            \"image_ok\": \"image_ok\",\n           \
          \ \"image_low_quality\": \"image_low_quality\",\n            \"malicious_image\"\
          : \"malicious_image\",\n            \"manual_review\": \"manual_review\"\
          \n        }\n\n        image_quality = quality_map.get(\n            str(data.get(\"\
          image_quality\", \"\")).strip(),\n            \"manual_review\"\n      \
          \  )\n\n        next_route = route_map.get(\n            str(data.get(\"\
          next_route\", \"\")).strip(),\n            \"manual_review\"\n        )\n\
          \n        image_is_malicious = data.get(\"image_is_malicious\", False)\n\
          \n        if isinstance(image_is_malicious, str):\n            image_is_malicious\
          \ = (\n                image_is_malicious.strip().lower() == \"true\"\n\
          \            )\n        else:\n            image_is_malicious = bool(image_is_malicious)\n\
          \n        normal_count = max(\n            0, int(data.get(\"normal_image_count\"\
          , 0) or 0)\n        )\n        invalid_count = max(\n            0, int(data.get(\"\
          invalid_image_count\", 0) or 0)\n        )\n\n        # 根据最终路由统一关键字段\n \
          \       if next_route == \"malicious_image\":\n            image_is_malicious\
          \ = True\n            image_quality = \"malicious\"\n\n        elif next_route\
          \ == \"image_ok\":\n            image_is_malicious = False\n           \
          \ image_quality = \"image_ok\"\n\n        elif next_route == \"image_low_quality\"\
          :\n            image_is_malicious = False\n            image_quality = \"\
          image_low_quality\"\n\n        else:\n            image_is_malicious = False\n\
          \            image_quality = \"manual_review\"\n\n        return {\n   \
          \         \"image_is_malicious\": image_is_malicious,\n            \"image_quality\"\
          : image_quality,\n            \"image_category\": str(\n               \
          \ data.get(\"image_category\", \"无法判断\")\n            ),\n            \"\
          image_evidence\": str(\n                data.get(\"image_evidence\", \"\"\
          )\n            ),\n            \"image_reason\": str(\n                data.get(\"\
          image_reason\", \"\")\n            ),\n            \"normal_image_count\"\
          : normal_count,\n            \"invalid_image_count\": invalid_count,\n \
          \           \"next_route\": next_route,\n            \"parse_success\":\
          \ True,\n            \"parse_error\": \"\"\n        }\n\n    except Exception\
          \ as error:\n        default_result[\"parse_error\"] = str(error)\n    \
          \    return default_result"
        code_language: python3
