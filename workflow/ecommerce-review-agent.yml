    - data:
        code: "def unwrap(value):\n    \"\"\"\n    将聚合器输出的 {\"output\": 实际值} 还原成实际值。\n\
          \    同时兼容多层 output 包装。\n    \"\"\"\n    while isinstance(value, dict) and\
          \ \"output\" in value:\n        value = value[\"output\"]\n    return value\n\
          \n\ndef to_text(value, default=\"\"):\n    value = unwrap(value)\n\n   \
          \ if value is None:\n        return default\n\n    if isinstance(value,\
          \ (dict, list)):\n        return str(value)\n\n    return str(value)\n\n\
          \ndef to_bool(value):\n    value = unwrap(value)\n\n    if isinstance(value,\
