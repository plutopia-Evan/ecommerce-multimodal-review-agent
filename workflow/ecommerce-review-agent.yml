    - data:
        code: "import json\nimport re\n\ndef main(llm_text: str) -> dict:\n    raw\
          \ = llm_text or \"\"\n\n    if \"</think>\" in raw:\n        raw = raw.rsplit(\"\
          </think>\", 1)[-1]\n\n    raw = re.sub(\n        r\"```json|```\",\n   \
          \     \"\",\n        raw,\n        flags=re.IGNORECASE\n    ).strip()\n\n\
          \    start = raw.find(\"{\")\n    end = raw.rfind(\"}\")\n\n    if start\
          \ == -1 or end == -1 or end < start:\n        return {\n            \"parse_success\"\
          : False,\n            \"parse_error\": \"没有找到有效JSON\",\n            \"has_negative_factor\"\
          : False,\n            \"is_malicious\": False,\n            \"malicious_type\"\
          : \"无\",\n            \"evidence\": \"\",\n            \"reason\": \"\"\
          ,\n            \"next_route\": \"manual_review\"\n        }\n\n    try:\n\
          \        data = json.loads(raw[start:end + 1])\n\n        def to_bool(value):\n\
          \            if isinstance(value, bool):\n                return value\n\
          \            return str(value).strip().lower() in [\n                \"\
          true\", \"是\", \"yes\", \"1\"\n            ]\n\n        next_route = str(\n\
          \            data.get(\"next_route\", \"\")\n        ).strip()\n\n     \
          \   allowed_routes = [\n            \"malicious\",\n            \"objective_negative\"\
          ,\n            \"low_quality\"\n        ]\n\n        if next_route not in\
          \ allowed_routes:\n            return {\n                \"parse_success\"\
          : False,\n                \"parse_error\": \"next_route不在允许范围内\",\n    \
          \            \"has_negative_factor\": to_bool(\n                    data.get(\"\
          has_negative_factor\", False)\n                ),\n                \"is_malicious\"\
          : to_bool(\n                    data.get(\"is_malicious\", False)\n    \
          \            ),\n                \"malicious_type\": str(\n            \
          \        data.get(\"malicious_type\", \"无\")\n                ),\n     \
          \           \"evidence\": str(data.get(\"evidence\", \"\")),\n         \
          \       \"reason\": str(data.get(\"reason\", \"\")),\n                \"\
          next_route\": \"manual_review\"\n            }\n\n        return {\n   \
          \         \"parse_success\": True,\n            \"parse_error\": \"\",\n\
          \            \"has_negative_factor\": to_bool(\n                data.get(\"\
          has_negative_factor\", False)\n            ),\n            \"is_malicious\"\
          : to_bool(\n                data.get(\"is_malicious\", False)\n        \
          \    ),\n            \"malicious_type\": str(\n                data.get(\"\
          malicious_type\", \"无\")\n            ),\n            \"evidence\": str(data.get(\"\
          evidence\", \"\")),\n            \"reason\": str(data.get(\"reason\", \"\
          \")),\n            \"next_route\": next_route\n        }\n\n    except Exception\
          \ as error:\n        return {\n            \"parse_success\": False,\n \
          \           \"parse_error\": str(error),\n            \"has_negative_factor\"\
          : False,\n            \"is_malicious\": False,\n            \"malicious_type\"\
          : \"无\",\n            \"evidence\": \"\",\n            \"reason\": \"\"\
          ,\n            \"next_route\": \"manual_review\"\n        }"
        code_language: python3
