    - data:
        code: "import re\n\ndef main(\n    review_text: str,\n    product_title: str,\n\
          \    product_description: str,\n    review_images: list\n) -> dict:\n  \
          \  text = (review_text or \"\").strip()\n    title = (product_title or \"\
          \").strip()\n    description = (product_description or \"\").strip()\n \
          \   images = review_images or []\n\n    clean_text = re.sub(r\"\\s+\", \"\
          \", text)\n    char_count = len(clean_text)\n    images_count = len(images)\n\
          \    has_images = images_count > 0\n\n    errors = []\n    if not title:\n\
          \        errors.append(\"缺少商品标题\")\n    if not description:\n        errors.append(\"\
          缺少商品介绍\")\n    if not text and not has_images:\n        errors.append(\"\
          评价正文和图片不能同时为空\")\n\n    return {\n        \"clean_text\": text,\n      \
          \  \"char_count\": char_count,\n        \"is_long\": char_count > 60,\n\
          \        \"has_images\": has_images,\n        \"images_count\": images_count,\n\
          \        \"valid_input\": len(errors) == 0,\n        \"validation_error\"\
          : \"；\".join(errors),\n        \"text_path\": \"long_review\" if char_count\
          \ > 60 else \"short_review\"\n    }"
