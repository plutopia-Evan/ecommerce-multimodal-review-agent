    - data:
        code: "import json\nimport re\n\ndef main(llm_text: str) -> dict:\n    raw\
          \ = llm_text or \"\"\n\n    # 去掉DeepSeek的思考内容\n    if \"</think>\" in raw:\n\
          \        raw = raw.rsplit(\"</think>\", 1)[-1]\n\n    # 去掉可能出现的Markdown代码块\n\
          \    raw = re.sub(\n        r\"```json|```\",\n        \"\",\n        raw,\n\
          \        flags=re.IGNORECASE\n    ).strip()\n\n    # 提取最终JSON对象\n    start\
          \ = raw.find(\"{\")\n    end = raw.rfind(\"}\")\n\n    if start == -1 or\
          \ end == -1 or end < start:\n        raise ValueError(\"没有找到有效的JSON结果\"\
          )\n\n    data = json.loads(raw[start:end + 1])\n\n    allowed_routes = [\n\
          \        \"malicious\",\n        \"objective_negative_candidate\",\n   \
          \     \"template_check\"\n    ]\n\n    next_route = str(data.get(\"next_route\"\
          , \"\")).strip()\n\n    if next_route not in allowed_routes:\n        raise\
          \ ValueError(\n            \"next_route不是允许的路由值：\" + next_route\n      \
          \  )\n\n    return {\n        \"has_negative_factor\": bool(\n         \
          \   data.get(\"has_negative_factor\", False)\n        ),\n        \"is_malicious\"\
          : bool(\n            data.get(\"is_malicious\", False)\n        ),\n   \
          \     \"malicious_type\": str(\n            data.get(\"malicious_type\"\
          , \"无\")\n        ),\n        \"evidence\": str(\n            data.get(\"\
          evidence\", \"\")\n        ),\n        \"reason\": str(\n            data.get(\"\
          reason\", \"\")\n        ),\n        \"next_route\": next_route\n    }"
